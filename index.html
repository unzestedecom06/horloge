<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horloge citron</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    .horloge {
      width: 100%;
      height: 100%;
      background: #f8c74b;
      color: #fffbe2;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
    }

    .heure {
      display: flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      font-size: clamp(36px, 17vw, 85px);
      font-weight: 800;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
    }

    .secondes {
      font-size: 0.34em;
      font-weight: 600;
      letter-spacing: 0;
      margin-left: 4px;
    }
  </style>
</head>

<body>
  <div class="horloge">
    <div class="heure">
      <span id="heure">--:--</span>
      <span class="secondes" id="secondes">--</span>
    </div>
  </div>

  <script>
    const formatHeure = new Intl.DateTimeFormat('fr-FR', {
      timeZone: 'Europe/Paris',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hourCycle: 'h23'
    });

    function actualiserHorloge() {
      const parties = formatHeure.formatToParts(new Date());

      const obtenir = (type) =>
        parties.find(partie => partie.type === type).value;

      document.getElementById('heure').textContent =
        obtenir('hour') + ':' + obtenir('minute');

      document.getElementById('secondes').textContent =
        obtenir('second');
    }

    actualiserHorloge();
    setInterval(actualiserHorloge, 1000);
  </script>
</body>
</html>

<link rel="stylesheet" href="style.css">
<div class="shell" id="citron-shell">
  <div class="top">
    <span class="eyebrow">LE TEMPS FILE, PROFITE ☀️</span>
    <span class="live"><span class="dot"></span>PARIS · EN DIRECT</span>
  </div>

  <div class="center">
    <div class="greeting" id="citron-greeting">Bonjour, rayon de soleil ! ☀️</div>
    <div class="clock">
      <span id="citron-hm">--:--</span><span class="seconds" id="citron-sec">--</span>
    </div>
    <div class="date" id="citron-date">Paris, France</div>
    <div class="sub">Un petit instant pour toi, entre deux projets ✨</div>
  </div>

  <div class="progresslabel">
    <span>TA JOURNÉE EN COURS</span>
    <span id="citron-percent">0 %</span>
  </div>
  <div class="track"><div class="fill" id="citron-fill"></div></div>
  <div class="progresslabel">
    <span>00:00</span><span>23:59</span>
  </div>

  <div class="bottom">
    <button id="citron-mood">☀️ Mood citron</button>
    <span class="signature">Fais confiance au timing.</span>
    <button class="lemon" id="citron-lemon" aria-label="Surprise citron">🍋</button>
  </div>
  <div class="secret" id="citron-secret" aria-live="polite"></div>
</div>
<script src="script.js"></script>
